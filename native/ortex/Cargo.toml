[package]
name = "ortex"
version = "0.1.10"
license = "MIT"
repository = "https://github.com/RiverFinancial/ortex"
authors = []
edition = "2018"
rust-version = "1.92"

[lib]
name = "ortex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.29.0"
ort = { version = "=2.0.0-rc.8", default-features = false, features = ["ndarray", "half"] }
ndarray = "0.16.1"
half = "2.2.1"

[features]
default = ["ort/load-dynamic"]
# ONNXRuntime Execution providers
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
