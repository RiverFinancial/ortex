[package]
name = "ortex"
version = "0.2.0"
authors = []
edition = "2021"
rust-version = "1.92"

[lib]
name = "ortex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38.0", default-features = false, features = ["nif_version_2_16"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "half"] }
ndarray = "0.17.2"
half = "2.2.1"

[features]
default = ["load-dynamic", "api-17"]
# Diagnostic-only alternate schedule for bench/schedulers.exs; never in prebuilts.
benchmark-dirty-cpu = []
load-dynamic = ["ort/load-dynamic"]
download-binaries = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-rustls"]
tls-rustls = ["ort/tls-rustls"]
lax-feature-matching = ["ort/lax-feature-matching"]
# ONNXRuntime Execution providers
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
api-17 = ["ort/api-17"]
api-18 = ["ort/api-18"]
api-19 = ["ort/api-19"]
api-20 = ["ort/api-20"]
api-21 = ["ort/api-21"]
api-22 = ["ort/api-22"]
api-23 = ["ort/api-23"]
api-24 = ["ort/api-24"]
api-25 = ["ort/api-25"]
api-26 = ["ort/api-26"]
api-27 = ["ort/api-27"]
api-28 = ["ort/api-28"]
api-29 = ["ort/api-29"]
api-30 = ["ort/api-30"]
api-31 = ["ort/api-31"]
acl = ["ort/acl"]
onednn = ["ort/onednn"]
rocm = ["ort/rocm"]
