name: Source validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: source-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source:
    name: API ${{ matrix.api }} / runtime ${{ matrix.runtime }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 17, runtime: '1.17.3', elixir: '1.16.3', otp: '26.2.5.15'}
          - {api: 17, runtime: '1.24.4', elixir: '1.20.4', otp: '29.1.1'}
          - {api: 24, runtime: '1.24.4', elixir: '1.20.4', otp: '29.1.1'}
    env:
      MIX_ENV: test
      ORTEX_BUILD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
      - name: Install test runtime
        run: python scripts/install_runtime.py '${{ matrix.runtime }}'
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: cargo +1.93.1 fmt --manifest-path native/ortex/Cargo.toml --check
      - name: Select API floor
        env:
          API: ${{ matrix.api }}
        run: |
          echo 'import Config' > config/ci.exs
          echo "config :ortex, Ortex.Native, features: [\"load-dynamic\", \"api-${API}\"]" >> config/ci.exs
          echo 'import_config "ci.exs"' >> config/config.exs
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix run --no-start scripts/check_global_pool.exs
      - name: Verify recoverable runtime loading errors
        run: ORT_DYLIB_PATH=/does-not-exist/libonnxruntime.so mix run --no-start scripts/check_missing_runtime.exs
      - name: Record diagnostic benchmark
        run: mix run bench/inference.exs 2000 8
  alpine:
    name: Alpine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build --progress=plain -f Dockerfile.alpine -t ortex-alpine .
      - run: docker run --rm ortex-alpine
