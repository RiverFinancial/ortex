name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      scope:
        type: string
        default: pr
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      scope: ${{ steps.matrix.outputs.scope }}
      alpine: ${{ steps.matrix.outputs.alpine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - id: matrix
        env:
          SCOPE: ${{ inputs.scope || (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full') && 'pr' || 'full') }}
        run: |
          python scripts/ci.py policy
          {
            echo "value=$(python scripts/ci.py matrix --scope "$SCOPE")"
            echo "scope=$SCOPE"
            echo "alpine=$(python scripts/ci.py matrix --scope alpine)"
          } >> "$GITHUB_OUTPUT"
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.23'
          install_args: actionlint shellcheck shfmt
          cache: false
          add_shims_to_path: false
      - name: Prepare checkers
        run: |
          make setup.rust
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          make deps
      - run: make lint test.tooling docs
  source:
    needs: policy
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Select runtime and Nx boundary
        env:
          RUNTIME: ${{ matrix.runtime }}
          NX_MODE: ${{ matrix.nx }}
        run: |
          python scripts/install_runtime.py install --version "$RUNTIME"
          python scripts/ci.py nx "$NX_MODE"
          if [[ "$NX_MODE" == locked ]]; then
            mix deps.get --check-locked
          else
            mix deps.update nx
            mix deps.get
          fi
      - name: Validate library, model, system, and package suites
        run: |
          mix compile --warnings-as-errors
          make test test.models test.system test.package
      - name: Render library coverage
        if: matrix.id == 'linux-current'
        run: |
          make coverage
          cat cover/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.id }}
          path: |
            cover/
            dist/reports/
          retention-days: 14
          if-no-files-found: ignore
      - name: Assemble native target archive
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package.py nif --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.policy.outputs.scope == 'full' && matrix.nx == 'locked'
        with:
          name: nif-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          retention-days: 14
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the declared minimum Rust version
        working-directory: native/ortex
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 check --locked --features ort/load-dynamic
  alpine:
    needs: policy
    if: needs.policy.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.alpine) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Alpine source and package consumers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build -f ci/containers/alpine.Dockerfile -t ortex-alpine .
          docker run --name ortex-alpine -e "TARGET=$TARGET" ortex-alpine
          docker cp ortex-alpine:/app/dist ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nif-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          retention-days: 14
          if-no-files-found: error
  bundle-check:
    needs: [policy, hygiene, source, msrv, alpine]
    if: needs.policy.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MIX_ENV: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nif-*
          merge-multiple: true
          path: dist
      - name: Exercise complete release assembly without publication
        run: |
          python scripts/release.py validate
          make deps docs inventory
          version=$(python scripts/release.py validate)
          tar -czf "dist/docs-$version.tar.gz" -C doc .
          python scripts/package.py assemble --all
          python scripts/release.py verify
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if test -n "$previous"; then
            python scripts/release.py notes --from "$previous" --output dist/RELEASE_NOTES.md
          else
            python scripts/release.py notes --output dist/RELEASE_NOTES.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            dist/ortex-*
            dist/docs-*
            dist/source.cdx.json
            dist/artifacts.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          retention-days: 14
          if-no-files-found: error
  validated:
    if: always()
    needs: [policy, hygiene, source, msrv, alpine, bundle-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          scope = jobs['policy']['outputs'].get('scope')
          for name, job in jobs.items():
              allowed = {'success', 'skipped'} if name in {'alpine', 'bundle-check'} and scope == 'pr' else {'success'}
              if job['result'] not in allowed:
                  raise SystemExit(f"{name}: {job['result']}")
          PY
      - name: Record full-validation marker
        if: needs.policy.outputs.scope == 'full' && github.ref == 'refs/heads/main'
        run: echo validated > validation.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.policy.outputs.scope == 'full' && github.ref == 'refs/heads/main'
        with:
          name: compatibility-validated
          path: validation.txt
          retention-days: 14
