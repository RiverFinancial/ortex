name: Stage release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    # actionlint 1.7.12 does not yet parse GitHub's $/ reusable-workflow syntax.
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]
    with:
      scope: full
  audit:
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]
  assemble:
    needs: [validate, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MIX_ENV: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nif-*
          merge-multiple: true
          path: dist
      - name: Assemble reviewed artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          make deps docs inventory
          tar -czf "dist/docs-${RELEASE_TAG#v}.tar.gz" -C doc .
          python scripts/package.py assemble --all
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if test -n "$previous"; then
            python scripts/release.py notes --from "$previous" --output dist/RELEASE_NOTES.md
          else
            python scripts/release.py notes --output dist/RELEASE_NOTES.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            dist/ortex-*
            dist/docs-*
            dist/source.cdx.json
            dist/artifacts.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          retention-days: 30
          if-no-files-found: error
  stage:
    if: github.repository == 'RiverFinancial/ortex'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create only the fork's draft release and upload its bundle.
      id-token: write # Authenticate build provenance attestation.
      attestations: write # Record provenance for the completed release bundle.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Stage the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo RiverFinancial/ortex --draft --verify-tag --notes-file dist/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" dist/* --repo RiverFinancial/ortex
