name: Stage release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    # actionlint 1.7.12 does not yet parse GitHub's $/ reusable-workflow syntax.
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]
    with:
      scope: full
  audit:
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]
  verify-release:
    needs: [validate, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - name: Verify the tag and complete tested bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          python scripts/release.py verify
  stage:
    if: github.repository == 'RiverFinancial/ortex' && vars.ORTEX_STAGE_RELEASES == 'true'
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create only the fork's draft release and upload its bundle.
      id-token: write # Authenticate build provenance attestation.
      attestations: write # Record provenance for the completed release bundle.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Stage the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo RiverFinancial/ortex --draft --verify-tag --notes-file dist/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" dist/* --repo RiverFinancial/ortex
